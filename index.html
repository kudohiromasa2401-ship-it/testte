<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日の日報</title>
  <style>
    /* 全要素のサイズ計算を統一 */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* 親ページの余白とスクロールバーを完全に排除 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* 親側のスクロールバーを完全に非表示 */
    }

    /* iframeをビューポート全体にフィットさせる */
    iframe {
      width: 100%;
      height: 100vh; /* 画面の高さいっぱいに固定 */
      border: none;
      display: block; /* 下部の余計な隙間を削除 */
    }
  </style>
</head>
<body>

  <iframe 
    src="https://script.google.com/a/macros/sungrove.co.jp/s/AKfycbz5e7_fIdBxLSi-LHPthnMpn2GA2jybA5pdUBIfMsHR7EEBgwzHtKZrVUDLkwTGUA/exec">
  </iframe>

</body>
</html>
